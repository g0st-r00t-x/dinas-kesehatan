services:
  app:
    image: dinkes-app
    container_name: dinkes_app_stack_v2
    environment:
      - APP_NAME=DINKES UMPEG
      - APP_ENV=local
      - APP_KEY=base64:6HhW/orVfuvx5umtoD5QzEBTSdZv6F1b60Gu/ae7Izs=
      - APP_DEBUG=true
      - APP_URL=http://localhost:7080
      
      - FONNTE_API_TOKEN=A5crhvScDqWs4PC8Lo9c
      - DEFAULT_PHONE_NUMBER=6287880433119
      
      - LOG_CHANNEL=stack
      - LOG_DEPRECATIONS_CHANNEL=null
      - LOG_LEVEL=debug
      
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=dinkes_v2
      - DB_USERNAME=dinkes
      - DB_PASSWORD=dinkes
      - RUN_MIGRATIONS=true
      
      - BROADCAST_DRIVER=reverb
      - CACHE_DRIVER=file
      - FILESYSTEM_DISK=local
      - QUEUE_CONNECTION=sync
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      
      - REVERB_APP_ID=719062
      - REVERB_APP_KEY=yakikozfqvpfx632zee6
      - REVERB_APP_SECRET=ef7zu7mqgetnjefn7uw0
      - REVERB_PORT=6001
      - REVERB_HOST=0.0.0.0
      - REVERB_SCHEME=http
      
      - VITE_REVERB_APP_KEY=yakikozfqvpfx632zee6
      - VITE_REVERB_HOST=localhost:7080
      - VITE_REVERB_PORT=6001
      - VITE_REVERB_SCHEME=http
    ports:
      - "7080:8082"     # HTTP ke FrankenPHP
      - "7443:8443"     # HTTPS ke FrankenPHP
      - "6001:8081"     # WebSocket (Reverb)

    volumes:
      - dinkes_app_storage:/app/storage
      - dinkes_app_cache:/app/bootstrap/cache
    restart: always
    networks:
      - dinkes_network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: dinkes_umpeg_mysql
    restart: always
    environment:
      - MYSQL_DATABASE=dinkes_v2
      - MYSQL_USER=dinkes
      - MYSQL_PASSWORD=dinkes
      - MYSQL_ROOT_PASSWORD=dinkes_root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3317:3306"
    networks:
      - dinkes_network

networks:
  dinkes_network:
    driver: bridge

volumes:
  mysql_data:
  dinkes_app_storage:
  dinkes_app_cache: